name: pito-deals

services:
  app:
    build:
      context: .
      target: app
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-r", "$$socket=@fsockopen('127.0.0.1',9000); if(!$$socket){exit(1);} fclose($$socket);"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - pito

  web:
    build:
      context: .
      target: web
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    restart: unless-stopped
    networks:
      - pito

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: pito_deals
      MYSQL_USER: pito
      MYSQL_PASSWORD: pito-local-password
      MYSQL_ROOT_PASSWORD: pito-local-root-password
    volumes:
      - pito_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ppito-local-root-password"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - pito

volumes:
  pito_mysql:

networks:
  pito:
    driver: bridge
